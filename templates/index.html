<!DOCTYPE html>
<html>
<head>
    <title>DriftMaster AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="header">
        🚗 DriftMaster AI
    </div>

    <div id="chat-box" class="chat-box">

        <div class="bot-message">
            Welcome to DriftMaster AI. Ask me anything about drifting.
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Ask anything about drifting..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
